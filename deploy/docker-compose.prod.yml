# ════════════════════════════════════════════════════════════════════════
# RAIL-BLOC — PRODUCTION (Oracle Always-Free ARM VM) compose file
# Self-contained (NOT an override). Frontend lives on Vercel
# (railbloc.vercel.app) which proxies /api/* here via Caddy.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Security posture: NOTHING is published to the host except Caddy 80/443.
# Postgres/Redis/API are internal-only. Requires CADDY_ACME_DOMAIN env.
# ════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 12
    restart: unless-stopped
    # No ports: reachable only inside the compose network.

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "alembic -c migrations/alembic.ini upgrade head"
    environment: &appenv
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      INGEST_KEY_TMS: ${INGEST_KEY_TMS}
      INGEST_KEY_TDMS: ${INGEST_KEY_TDMS}
      INGEST_KEY_SMMS: ${INGEST_KEY_SMMS}
      INGEST_KEY_FOIS: ${INGEST_KEY_FOIS}
      IMD_API_KEY: ${IMD_API_KEY}
      COA_BRIDGE_SECRET: ${COA_BRIDGE_SECRET}
      SOLVER_MAX_TIME_SECONDS: ${SOLVER_MAX_TIME_SECONDS}
      SOLVER_NUM_WORKERS: ${SOLVER_NUM_WORKERS}
      MONTHLY_PLAN_CRON: ${MONTHLY_PLAN_CRON:-0 6 1 * *}
      SEED_PASSWORD: ${SEED_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  seeder:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: python -m data.generators.seed_all
    environment:
      <<: *appenv
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    environment: *appenv
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    command: celery -A apps.workers.tasks:app worker --loglevel=info --concurrency=2 -s /tmp/schedule
    environment: *appenv
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    command: celery -A apps.workers.tasks:app beat --loglevel=info -s /tmp/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    environment: *appenv
    depends_on:
      redis: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    restart: unless-stopped

  redis:
    image: redis:7.2
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      retries: 12
    restart: unless-stopped
    # No ports: broker is internal-only.

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_DOMAIN: ${CADDY_ACME_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
