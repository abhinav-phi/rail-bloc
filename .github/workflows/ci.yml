name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: railbloc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r apps/api/requirements.txt
          pip install --no-deps build_wheels/*.whl
          pip install pytest pytest-asyncio

      - name: Run Pytest
        env:
          DATABASE_URL_SYNC: postgresql://postgres:password@localhost:5432/railbloc
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest -q

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify apps/web (Legacy)
        working-directory: apps/web
        run: |
          npm install
          npm run build

      - name: Verify frontend (Next.js)
        working-directory: frontend
        run: |
          npm install
          npm run lint
          npm run typecheck
          npm run build
